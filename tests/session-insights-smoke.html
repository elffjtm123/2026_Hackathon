<!doctype html><html lang="ko"><meta charset="utf-8"><title>목소리 활성도·종료 피드백 UI 검사</title>
<style>body{margin:0}.test-note{padding:14px;background:#fff0c8;color:#624e28;font:14px sans-serif;position:sticky;top:0;z-index:5}.test-actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}</style>
<div class="test-note">개발 검사 · 눈 크기·맥박·음성 수치는 합성 입력입니다. 앱은 감정을 판정하지 않으며, 모델 정확도 평가도 아닙니다. 카메라·마이크를 요청하지 않습니다.</div>
<div id="root"></div><script type="module">
import {createElement as h,useState} from 'react';import {createRoot} from 'react-dom/client';
import {SessionInsights} from '/src/features/affect/SessionInsights.tsx';
import {DeliveryReport} from '/src/features/delivery/DeliveryReport.tsx';
import {completionForUi,summaryForUi} from '/src/lib/realtimeProtocol.ts';
import '/src/styles.css';
import '/src/features/delivery/delivery.css';
// 10 s windows. The personal baseline is the median of windows starting at or after 30 s
// (analyzeActivation): windows 3-7 stay unchanged and outnumber the last 4, which move away from it.
function fixture(mode){
 const signals={faces:[],pulses:[]},windows=[];
 const n=mode==='short'?5:12,shift=i=>i<8?0:mode==='higher'?1:mode==='lower'?-1:0;
 for(let i=0;i<n;i++){
  for(let t=i*10000;t<(i+1)*10000;t+=200)signals.faces.push({time:t,eyeWide:.1+.1*shift(i)});
  if(mode!=='missing')signals.pulses.push({time:i*10000+5000,bpm:80+15*shift(i)});
  windows.push({start_ms:i*10000,end_ms:(i+1)*10000,observed_ms:10000,voiced_ms:5000,coverage:.5,pause_count:2,
   f0_median_hz:200+60*shift(i),articulation_rate:240+80*shift(i),speech_rate:160,
   loudness_dbfs:-25+6*shift(i),alpha_ratio_db:8,hammarberg_db:10,pvq:.08,disfluency_density:3});
 }
 const metrics={status:'unavailable',agc_on:false,report:{total_voiced_ms:n*5000,sentences:[],baseline:{},bursts:[]},windows:{window_ms:10000,baseline:{},windows}};
 const summary={sessionId:'synthetic-'+mode,durationSeconds:n*10,gazeStatus:'observed',gazeCoverageRatio:.85,gazeAwayRatio:.28,
  pronunciationAccuracy:null,speechPaceWarningCount:1,averageSyllablesPerMinute:390,speechStatus:'observed',
  fillerWordCounts:{음:3,어:1},fillerStatus:'observed',transcript:null,incomplete:false,deliveryMetrics:metrics};
 return {signals,metrics,summary};
}
function Demo(){const [mode,setMode]=useState('higher'),[real,setReal]=useState(null);
 const built=fixture(mode);const signals=real?{faces:[],pulses:[]}:built.signals;
 const summary=real?summaryForUi('public-audio',completionForUi(real),4,null):built.summary;
 const metrics=summary.deliveryMetrics;
 return h('main',{className:'practice-shell'},h('h1',null,'목소리 활성도·종료 피드백 검사'),
  real&&h('p',null,'공개 한국어 음성의 실제 Qwen 전사·Praat 특징 결과입니다. 얼굴·맥박 자료가 없어 해당 근거는 비어 있습니다.'),
  h('div',{className:'test-actions'},[['higher','기준보다 높은 목소리 활성도 예제'],['lower','기준보다 낮은 목소리 활성도 예제'],['similar','기준과 비슷한 예제'],['short','30초 이후 구간 부족 예제'],['missing','맥박 누락 예제']].map(([value,label])=>h('button',{key:value,onClick:()=>{setReal(null);setMode(value);},className:'secondary-button'},label)),
   h('button',{className:'secondary-button',onClick:async()=>{setReal(await(await fetch('/tests/fixtures/voice-delivery-public.json')).json());}},'실제 공개 음성 결과')),
  h(SessionInsights,{key:real?'public-audio':mode,summary,signals}),h(DeliveryReport,{metrics,sessionId:summary.sessionId}));}
createRoot(document.querySelector('#root')).render(h(Demo));
</script></html>
